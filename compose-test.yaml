services:
  ras-gate:
    build:
      context: .
      dockerfile: src/RasGate.Web/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080

      Rac__ExecutablePath: /opt/1c/rac/rac
      Rac__MaxConcurrentProcesses: 4
      Rac__TimeoutSeconds: 30
      Rac__MaxOutputBytes: 4194304

      Security__ApiKey: ${RASGATE_API_KEY}

    volumes:
      - type: bind
        source: ${RAC_HOST_PATH}
        target: /opt/1c/rac
        read_only: true

    ports:
      - "127.0.0.1:8080:8080"

  k6:
    image: grafana/k6:latest

    environment:
      BASE_URL: http://ras-gate:8080
      API_KEY: ${RASGATE_API_KEY}

    volumes:
      - type: bind
        source: ./scripts/load
        target: /scripts
        read_only: true

    depends_on:
      - ras-gate