name: rasgate

services:
  ras-gate:
    build:
      context: .
      dockerfile: src/RasGate.Web/Dockerfile

    restart: unless-stopped
    init: true

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Urls: http://0.0.0.0:8080
      LD_LIBRARY_PATH: /opt/1c/rac

      RasGate__InstanceName: ${RASGATE_INSTANCE_NAME:-RasGate Application}
      RasGate__ApiKey: ${RASGATE_API_KEY:?RASGATE_API_KEY is required}

      Rac__ExecutablePath: /opt/1c/rac/rac
      Rac__TimeoutSeconds: ${RAC_TIMEOUT_SECONDS:-30}
      Rac__StatusCacheSeconds: ${RAC_STATUS_CACHE_SECONDS:-30}
      Rac__MaxConcurrentProcesses: ${RAC_MAX_CONCURRENT_PROCESSES:-4}
      Rac__MaxOutputBytes: ${RAC_MAX_OUTPUT_BYTES:-4194304}
      Rac__MaxArgumentCount: ${RAC_MAX_ARGUMENT_COUNT:-128}
      Rac__MaxArgumentBytes: ${RAC_MAX_ARGUMENT_BYTES:-8192}
      Rac__MaxTotalArgumentBytes: ${RAC_MAX_TOTAL_ARGUMENT_BYTES:-24576}

    ports:
      - "${RASGATE_BIND_ADDRESS:-127.0.0.1}:${RASGATE_PORT:-5050}:8080"

    volumes:
      - type: bind
        source: ${RAC_HOST_PATH:?RAC_HOST_PATH is required}
        target: /opt/1c/rac
        read_only: true

      - type: volume
        source: logs
        target: /app/logs

    read_only: true
    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 40s

volumes:
  logs:
